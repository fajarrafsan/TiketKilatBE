spring.application.name=tiket_pesawat

server.port=${SERVER_PORT:8090}
app.base-url=${APP_BASE_URL:http://localhost:8090}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tiket}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

jwt.kunci-rahasia=${JWT_SECRET:rahasia_ini_panjang_sekali_dan_sangat_sulit_ditebak_12345}
jwt.waktu-kadaluarsa=${JWT_EXPIRATION_MS:3600000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:fajar.rafsan02@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

admin.default-email=${ADMIN_EMAIL:fajar.rafsan01@gmail.com}
admin.default-password=${ADMIN_PASSWORD:}

midtrans.server-key=${MIDTRANS_SERVER_KEY:}
midtrans.client-key=${MIDTRANS_CLIENT_KEY:}
midtrans.is-production=${MIDTRANS_IS_PRODUCTION:false}
